name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          python -m flake8 app.py tests/

      - name: Run unit tests
        run: |
          python -m pytest

      - name: Build Docker image
        run: |
          docker build \
            -t nishdvops/eks-cicd-demo:latest \
            -t nishdvops/eks-cicd-demo:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push nishdvops/eks-cicd-demo:latest
          docker push nishdvops/eks-cicd-demo:${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::864365984141:role/github-actions-eks-role
          aws-region: ap-south-1

      - name: Update kubeconfig
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name eks-cicd-demo

      - name: Deploy to EKS with Helm
        if: github.event_name == 'push'
        run: |
          helm upgrade --install eks-cicd-demo helm/eks-cicd-demo \
            --namespace default \
            --set image.repository=nishdvops/eks-cicd-demo \
            --set image.tag=${{ github.sha }} \
            --wait


